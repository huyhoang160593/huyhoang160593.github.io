name: Verify

# The repo's checks, on every pull request and on main. `Deploy to GitHub Pages`
# is a separate workflow: it runs the build again and publishes, but it never
# runs the lint, so a change it accepted could still be unlinted.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same setup as the deploy workflow; see docs/adr/0001.
      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          node-version: "26"

      - name: Install dependencies
        run: nub ci

      # One command, so a branch that adds a guard to `verify` gets it run here
      # without touching this file.
      - name: Verify
        run: nub run verify
